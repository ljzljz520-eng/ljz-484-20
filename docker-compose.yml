version: '3.8'

services:
  novel-backend:
    build: 
      context: ./novel-backend
      dockerfile: Dockerfile
    container_name: novel-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Djava.security.egd=file:/dev/./urandom
    networks:
      - novel-net

  novel-frontend:
    build:
      context: ./novel-frontend
      dockerfile: Dockerfile
    container_name: novel-frontend
    ports:
      - "3000:80"
    depends_on:
      - novel-backend
    networks:
      - novel-net

networks:
  novel-net:
    driver: bridge
